<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Planner | Discover Albania</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <div class="logo"><a href="index.html">Discover <span>Albania</span></a></div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="experiences.html">Experiences</a></li>
        <li><a href="planner.html">Trip Planner</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="operators.html">For Operators</a></li>
      </ul>
      <div id="auth-status"><button id="login-btn" class="cta-btn">Login</button></div>
      <button class="menu-toggle">☰</button>
    </nav>
  </header>

  <section class="section">
    <div class="section-header">
      <h2>AI Trip Planner</h2>
      <p>Create a personalized Albania itinerary in seconds</p>
    </div>
    <form id="planner-form">
      <div class="form-row">
        <div class="form-group">
          <label>Trip length</label>
          <select id="days"><option>3 days</option><option selected>5 days</option><option>7 days</option><option>10+ days</option></select>
        </div>
        <div class="form-group">
          <label>Travel style</label>
          <select id="style">
            <option>Relaxed & Beaches</option>
            <option>Active & Hiking</option>
            <option>Culture & History</option>
            <option selected>Mix of Everything</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Interests</label>
        <div class="checkboxes">
          <label><input type="checkbox" value="beaches" checked> Beaches & Riviera</label>
          <label><input type="checkbox" value="mountains"> Mountains & Hiking</label>
          <label><input type="checkbox" value="culture"> Culture & UNESCO</label>
          <label><input type="checkbox" value="food"> Food & Wine</label>
          <label><input type="checkbox" value="nature"> Nature & Blue Eye</label>
        </div>
      </div>
      <button type="submit" class="btn primary large">Generate My Albania Itinerary</button>
    </form>
    <div id="itinerary-result" class="hidden"></div>
  </section>

  <footer><p>&copy; 2026 Discover Albania</p></footer>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
